[project]
name = "cota-opt"
# Pre-1.0 on purpose: 0.9.x is the external working-paper state. 1.0.0 is
# tagged only when every v1.0 gate in docs/process/RELEASE_AND_REPORTING_GUIDELINES.md
# and docs/RELEASE_PROVENANCE.md passes. The frozen research record is commit
# cd03af9c (research-final), independent of this package version.
version = "0.9.0"
description = "COTA Transit Network Model and Optimization Harness"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Ian Gregory" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.5",
    "networkx>=3.0",
    "requests>=2.31",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/ian-gregory94/cota-route-optimization"
Documentation = "https://github.com/ian-gregory94/cota-route-optimization/tree/master/docs"
"Technical report" = "https://github.com/ian-gregory94/cota-route-optimization/blob/master/docs/report/TECHNICAL_REPORT.md"
Provenance = "https://github.com/ian-gregory94/cota-route-optimization/blob/master/docs/RELEASE_PROVENANCE.md"

[project.scripts]
cota-opt = "cota_release.cli:main"

[project.optional-dependencies]
# The realtime collector is an optional feature: `cota-opt rt-collect` is the
# only caller, it imports lazily, and no result in this repository depends on
# it (the known-limitations table still records "scheduled != actual" as
# unquantified). It is declared here so the dependency is NAMED rather than
# ambient -- a clean install without it silently skipped 8 tests while the
# reproducibility record claimed 356 passed. `dev` pulls it in so the suite a
# contributor runs is the whole suite.
realtime = ["gtfs-realtime-bindings>=1.0"]
# ntd.parse_profile reads the FTA annual agency profile PDF. Nothing imports
# it at runtime, but the VOMS = 198 that validates the fleet proxy came out of
# it, so a reader reproducing that number needs the parser -- and it was
# undeclared, found by the same check that found the realtime gap.
ntd = ["pdfplumber>=0.10"]
dev = ["pytest>=7.0", "gtfs-realtime-bindings>=1.0", "pdfplumber>=0.10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `slow` marks tests that run real certification solves. They are part of the
# suite and run by default -- the path-set identity proof is worth minutes.
# Deselect with `-m "not slow"` when iterating.
markers = [
    "slow: runs a real solve; minutes rather than milliseconds",
]
