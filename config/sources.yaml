    download_method: HTTP GET (user-mediated in this environment)
    version: "feed_info feed_version 2026-MAY-04-BB_20260630 (service 2026-05-04 to 2026-09-06)"
    citation: "Central Ohio Transit Authority (2026). COTA GTFS static feed, version 2026-MAY-04-BB_20260630. https://www.cota.com/data/"
    retrieval: >-
      Original retrieval date not recorded in the registry. Registry record:
      restored 2026-09-25 after the container loss, sha256 verified against
      the digests recorded in committed experiment artifacts (data/raw/_provenance.json).
    sha256: b11634f117a35a27a1813ed1eeef2b29b9484c6afdda0757262026ed2c9b3bf0
    status: BLOCKED_EGRESS
    notes: URL confirmed on cota.com/data 2026-08-25.
