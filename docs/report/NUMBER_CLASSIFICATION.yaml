# Classification of numbers in public-facing priority sections that are NOT
# machine-checked claims (scripts/audit_public_numbers.py).
#
# Classes:
#   config        configuration constant or experiment design parameter (a value the
#                 study set, quoted from config/, a contract or a level definition)
#   design_count  a count fixed by the study design (candidates generated, cells run)
#   retracted     a withdrawn value quoted as withdrawn (report §9)
#   descriptive   non-load-bearing description
#   traced        a scientific number traced to a named artifact or record, NOT yet
#                 machine-checked; the source is given. These are the remaining gap.
#
# Keys are tokens as they appear in the document (per document). A token listed
# here covers every occurrence in that document's audited sections, so only list
# tokens whose every occurrence has the stated class.

